version: '3.3'

services:
  ddclient-noip:
    image: lscr.io/linuxserver/ddclient:latest
    container_name: ddclient-noip
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/ddclient.conf.noip:/config/ddclient.conf
    networks:
      docker:
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 192.168.50.1     
    logging:
      options:
        max-size: 100M

  ddclient-dedyn:
    image: lscr.io/linuxserver/ddclient:latest
    container_name: ddclient-dedyn
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/ddclient.conf.dedyn:/config/ddclient.conf
    networks:
      docker:
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 192.168.50.1      
    logging:
      options:
        max-size: 100M

networks:
  docker:
